version: '3.8'
services:
  apartment-db:
    image: postgres:17-alpine
    container_name: apartment-db
    restart: always
    environment:
      POSTGRES_DB: apartments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2005
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: